<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" class="w-10 h-10">
    <!-- Outer Glow / Orbit Track -->
    <ellipse cx="24" cy="24" rx="21" ry="8.5" transform="rotate(-28 24 24)" stroke="#E60012" stroke-width="2.2" stroke-dasharray="120" stroke-dashoffset="15" opacity="0.9" />
    <!-- Secondary Orbit Ring -->
    <ellipse cx="24" cy="24" rx="19" ry="7" transform="rotate(35 24 24)" stroke="#ffffff" stroke-width="1.8" opacity="0.85" />
    <!-- Core Planet / Sphere -->
    <circle cx="24" cy="24" r="10.5" fill="url(#coreGradient)" />
    <!-- Inner Accent Ring -->
    <circle cx="24" cy="24" r="7.5" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" fill="none" />
    <!-- Center Pivot -->
    <circle cx="24" cy="24" r="3" fill="#ffffff" />
    <defs>
        <radialGradient id="coreGradient" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#FF3344" />
            <stop offset="70%" stop-color="#E60012" />
            <stop offset="100%" stop-color="#80000A" />
        </radialGradient>
    </defs>
</svg>
